name: Template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m venv .runtime
      - run: .runtime/bin/python -m pip install --require-hashes -r project_template/requirements/production.txt
      - run: python -m venv .developer
      - run: .developer/bin/python -m pip install --require-hashes -r project_template/requirements/develop.txt
      - run: make check
        env:
          TEMPLATE_RUNTIME_PYTHON: ${{ github.workspace }}/.runtime/bin/python
          TEMPLATE_DEVELOPER_PYTHON: ${{ github.workspace }}/.developer/bin/python

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements-audit.txt
      - run: make audit

[tool.ruff]
line-length = 119
# Template Python contains Django substitution syntax; check executable helpers
# and repository tests, which are also type-checked below.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["tests", "project_template/commands.py"]
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
